[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tex2md"
version = "0.1.0"
description = "Convert papers (arXiv LaTeX, JATS XML, PDF) to Markdown for the thesis library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # standard library only; pandoc and TeX are external tools (see `tex2md doctor`)

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
tex2md = "tex2md.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tex2md"]   # includes filters/*.lua

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "slow: replays real conversions from the local cache (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["marker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # long regex lines are inherent to this code base
    "E741",    # ambiguous names (l, O) are used in the TeX scanners
    "SIM102", "SIM108", "B905",
]

[tool.mypy]
python_version = "3.11"
files = ["src/tex2md"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
